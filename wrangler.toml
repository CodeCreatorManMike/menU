name = "menu"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Static front end. The Worker runs first so /api/* reaches the API.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# No ids needed: wrangler creates the D1 database and R2 bucket on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "flat-feast"

[[r2_buckets]]
binding = "IMAGES"
