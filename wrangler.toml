# Deployed with: npx wrangler deploy
# The Worker name must match the Worker name shown in the Cloudflare dashboard.
name = "menu"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Keep variables and secrets set in the dashboard (such as ADMIN_PASSWORD) when a build redeploys.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# Only /api/* runs the Worker; pages, scripts and styles are served straight from ./public.
run_worker_first = ["/api/*"]

# No id on purpose: wrangler creates the database on first deploy. Photos are stored in it too.
[[d1_databases]]
binding = "DB"
database_name = "flat-feast"
