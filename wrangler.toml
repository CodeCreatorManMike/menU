# Deployed with: npx wrangler deploy
# The Worker name must match the Worker name shown in the Cloudflare dashboard.
name = "menu"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Only /api/* runs the Worker; pages, scripts and styles are served straight from ./public.
run_worker_first = ["/api/*"]

# No ids on purpose: wrangler creates the database and image bucket on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "flat-feast"

[[r2_buckets]]
binding = "IMAGES"
